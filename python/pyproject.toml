[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openllm-client"
version = "0.1.0"
description = "Python client for the OpenLLM daemon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "OpenLLM Contributors" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60.0",
    "betterproto[compiler]>=2.0.0b6",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/openllm/openllm"
Repository = "https://github.com/openllm/openllm"
Documentation = "https://github.com/openllm/openllm#readme"

[tool.hatch.build.targets.wheel]
packages = ["openllm_client"]
