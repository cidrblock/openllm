[workspace]
resolver = "2"
members = [
    "crates/openllm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["OpenLLM Contributors"]
repository = "https://github.com/openllm/openllm"

[workspace.dependencies]
# Shared dependencies (for future additional crates if needed)
thiserror = "2"
once_cell = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
