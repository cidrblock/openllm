[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openllm-client"
version = "0.1.0"
description = "OpenLLM gRPC client for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["openllm", "llm", "grpc", "ai", "client"]
authors = [
    { name = "OpenLLM Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/openllm/openllm"
Documentation = "https://github.com/openllm/openllm#readme"
Repository = "https://github.com/openllm/openllm"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openllm_grpc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
