[package]
name = "openllm"
version = "0.1.0"
edition = "2021"
description = "OpenLLM - Unified AI daemon with gRPC API for all clients"
license = "MIT"

[[bin]]
name = "openllm"
path = "src/main.rs"

[lib]
name = "openllm"
path = "src/lib.rs"

[dependencies]
# gRPC
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13"
prost-types = "0.13"

# HTTP server for web UI
axum = { version = "0.8", features = ["tokio"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
rust-embed = "8"
mime_guess = "2"

# Async runtime
tokio = { version = "1", features = ["full", "signal"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# LLM provider library - handles streaming, protocols, provider quirks
genai = "0.5"

# MCP (Model Context Protocol) client - official Rust SDK
rmcp = { version = "0.14", features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "schemars"
] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
hyperlocal = "0.9"

# Utils
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"

# Unix socket / networking
tower = "0.5"

# File watching for config
notify = "7"

# Platform directories
dirs = "5"

# System keychain access
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
keyring = "3"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
